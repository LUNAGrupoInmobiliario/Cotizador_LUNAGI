name = "lunagi-coti-api"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# Secreto para crear el primer superadmin (una sola vez):
#   npx wrangler secret put BOOTSTRAP_SECRET
#
# Binding KV (rellenar el id tras crear el namespace):
#   npx wrangler kv namespace create USUARIOS
[[kv_namespaces]]
binding = "USUARIOS"
id = "e89edd6842ea4057bc3d659f244ab86b"

[vars]
# Origenes permitidos para CORS, separados por coma. Durante la migracion se
# aceptan los dos; cuando GitHub Pages se apague, quitar el segundo.
ALLOWED_ORIGIN = "https://lunagi-cotizador.pages.dev,https://lunagrupoinmobiliario.github.io"
# Base del sitio, para que la landing use el mismo favicon que el cotizador
# (esta en otro dominio, asi que no sirven las rutas relativas).
SITIO_BASE = "https://lunagi-cotizador.pages.dev"
